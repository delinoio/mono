name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Optional base revision for affected validation
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Each job timeout is at least three times the longest observed run without
  # caches, so a hung service, download or test fails the job instead of
  # running until the six-hour default.
  changes:
    name: Plan affected CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.comparison.outputs.base }}
      head: ${{ steps.comparison.outputs.head }}
      quality: ${{ steps.plan.outputs.quality }}
      format: ${{ steps.plan.outputs.format }}
      fixtures: ${{ steps.plan.outputs.fixtures }}
      go: ${{ steps.plan.outputs.go }}
      rust: ${{ steps.plan.outputs.rust }}
      e2e: ${{ steps.plan.outputs.e2e }}
      workspace: ${{ steps.plan.outputs.workspace }}
      workflows: ${{ steps.plan.outputs.workflows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Resolve affected comparison
        id: comparison
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push)
              base="$PUSH_BASE"
              if [[ "$base" =~ ^0+$ ]]; then
                empty_tree="$(git hash-object -t tree /dev/null)"
                base="$(git -c user.name=CI -c user.email=ci@example.invalid commit-tree "$empty_tree" -m 'Empty comparison')"
              fi
              ;;
            workflow_dispatch)
              if [[ -n "$MANUAL_BASE" ]]; then
                base="$(git rev-parse --verify --end-of-options "${MANUAL_BASE}^{commit}")"
              else
                base="$(git merge-base origin/main "$head")"
              fi
              ;;
            *) exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Validation revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparison: $base..$head" >> "$GITHUB_STEP_SUMMARY"
      - name: Select affected validation
        id: plan
        env:
          CI_BASE: ${{ steps.comparison.outputs.base }}
          CI_HEAD: ${{ steps.comparison.outputs.head }}
        run: node scripts/ci/plan.mjs
  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        if: needs.changes.outputs.format == 'true'
        env:
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: pnpm format:check
      # The workspace package tests run in the workspace-packages and
      # workspace-servers jobs.
      - name: Test formatting, hooks and CI scripts
        if: needs.changes.outputs.fixtures == 'true'
        run: pnpm test:tooling
      - name: Validate pending changesets
        # Runs `changeset version` when a changeset is pending; it rewrites
        # files of this throwaway checkout, so it runs last.
        if: needs.changes.outputs.fixtures == 'true'
        run: scripts/ci/validate-changesets.sh
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          FORMAT_PLANNED: ${{ needs.changes.outputs.format }}
          FIXTURES_PLANNED: ${{ needs.changes.outputs.fixtures }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo "Planned: format=$FORMAT_PLANNED; fixtures=$FIXTURES_PLANNED"
            echo 'Commands (when planned): pnpm install --frozen-lockfile --ignore-scripts; pnpm format:check; pnpm test:tooling; scripts/ci/validate-changesets.sh (pending changeset validation)'
            echo "Result: $RESULT"
            echo 'Runtime, account, native platform and release acceptance: not performed. The workspace-packages job builds the app packages; CI does not deploy them.'
          } >> "$GITHUB_STEP_SUMMARY"
  go-fmt:
    name: Go formatting
    # Formatting checks every tracked Go file, builds nothing and takes
    # seconds, so this job does not wait for the planner. It runs for every
    # event, and ci-result requires it to succeed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # gofmt output can change between Go releases, so use the go.mod
      # toolchain instead of the runner's preinstalled Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # gofmt compiles nothing, so it needs no module or build cache.
          cache: false
      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 --no-run-if-empty gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt reports unformatted files"
            echo "$unformatted"
            exit 1
          fi
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          VALIDATION_REVISION: ${{ github.sha }}
        run: |
          {
            echo "Validation revision: $VALIDATION_REVISION"
            echo 'Commands in the root Go module: gofmt -l on tracked .go files'
            echo "Result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
  go-vet:
    name: Go vet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The go-test job owns the cache under the `go.sum` key. setup-go
          # cannot restore without saving, and both jobs would save different
          # caches under one key.
          cache: false
      - name: Vet Go module
        run: go vet ./...
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands in the root Go module: go vet ./...'
            echo "Result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
  go-test:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres for the Postgres-backed accounts-api and ownsand-api tests and
    # the OwnSand end-to-end suite (servers/ownsand-api/e2e). The credentials
    # exist only inside this job. Each suite creates its own uniquely named
    # databases on this one server.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Caches the Go module and build caches, keyed by the `go.sum` hash.
          # Only this job saves them under that key; the go-vet and workspace
          # jobs do not use them, and the protos job keys its cache by other
          # files, so no two jobs race to save different caches under one key.
          cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      # Installed before the Go tests: the OwnSand end-to-end suite runs the
      # TypeScript SDK test with rstest.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test Go module
        env:
          ACCOUNTS_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
          OWNSAND_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
          OWNSAND_E2E: "1"
        # -count=1 bypasses cached test results, so every run executes the
        # tests; the restored build cache only skips recompilation.
        run: go test -count=1 ./...
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands in the root Go module: pnpm install --frozen-lockfile --ignore-scripts; go test -count=1 ./... with a Postgres service, ACCOUNTS_TEST_DATABASE_URL, OWNSAND_TEST_DATABASE_URL and OWNSAND_E2E=1 (Postgres-backed accounts-api and ownsand-api tests and the OwnSand end-to-end suite with the process runtime)'
            echo "Result: $RESULT"
            echo 'Runtime, deployment and release acceptance: not performed. The OwnSand end-to-end suite uses the process test runtime, not a hypervisor. The go-fmt and go-vet jobs check formatting and vet findings, and the protos job checks the protobuf schemas and bindings.'
          } >> "$GITHUB_STEP_SUMMARY"
  protos:
    needs: changes
    # Every protobuf input is also a Go input, so the planner's `go` output
    # selects this job. It runs next to the go-test job instead of after it.
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The protobuf breaking-change check reads the comparison base.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Caches the buf CLI and protoc plugin builds that `go run` makes.
          # The key hashes the files that pin their versions, not `go.sum`,
          # so this cache and the go-test job cache have different keys and the
          # two jobs never race to save one key.
          cache: true
          cache-dependency-path: |
            scripts/protos.sh
            protos/buf.gen.yaml
      # scripts/protos.sh check also generates the TypeScript bindings with the
      # protoc-gen-es versions that packages/ownsand-sdk and apps/delino-accounts
      # pin.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check protobuf schemas and generated Go and TypeScript bindings
        shell: bash
        env:
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -euo pipefail
          scripts/protos.sh check
          # A root push compares against an empty-tree commit that only the
          # changes job created; it has no schemas to compare.
          if git cat-file -e "${COMPARISON_BASE}^{commit}" 2>/dev/null; then
            scripts/protos.sh breaking "$COMPARISON_BASE"
          else
            echo "Comparison base $COMPARISON_BASE is not in this checkout; breaking-change check skipped."
            echo "Protobuf breaking-change check: skipped, comparison base not in checkout" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands: pnpm install --frozen-lockfile --ignore-scripts; scripts/protos.sh check (buf lint, buf format and the Go and TypeScript binding drift check); scripts/protos.sh breaking <base>'
            echo "Result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
  go-platforms:
    name: Go on ${{ matrix.platform }}
    # The device agent, the guest helper and the CLI have macOS and Windows
    # code (build tags and `_darwin`/`_windows` files), and the macOS
    # Virtualization.framework runtime builds only with cgo on a macOS host.
    # The Linux go-vet and go-test jobs do not compile or run that code.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      # Report the failures of every platform in one run.
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Keep the repository line endings in the Windows checkout
        # Git for Windows on the runner image sets `core.autocrlf=true`, which
        # would check out CRLF files that the repository and the Linux jobs
        # never contain. The repository has no `.gitattributes`.
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Caches the Go module and build caches. The setup-go key includes
          # the runner OS and architecture, so these entries never share a key
          # with the Linux go-test job.
          cache: true
      - name: Vet Go module
        run: go vet ./...
      - name: Vet the other build configurations of the host OS
        shell: bash
        run: |
          set -euo pipefail
          other_arch=amd64
          if [[ "$(go env GOARCH)" == amd64 ]]; then
            other_arch=arm64
          fi
          case "$RUNNER_OS" in
            macOS)
              # The Virtualization.framework runtime has a cgo file for each
              # architecture and a fallback for builds without cgo.
              GOARCH="$other_arch" CGO_ENABLED=1 go vet ./...
              CGO_ENABLED=0 go vet ./...
              ;;
            Windows)
              GOARCH="$other_arch" go vet ./...
              ;;
            *)
              echo "::error::Unexpected runner OS $RUNNER_OS"
              exit 1
              ;;
          esac
          echo "Other architecture vetted: $other_arch" >> "$GITHUB_STEP_SUMMARY"
      - name: Test Go module
        # No Postgres service: Docker service containers run only on Linux
        # runners. The Postgres-backed accounts-api and ownsand-api tests and
        # the OwnSand end-to-end suite skip without ACCOUNTS_TEST_DATABASE_URL,
        # OWNSAND_TEST_DATABASE_URL and OWNSAND_E2E; the go-test job runs them
        # on Linux. The hypervisor
        # integration tests skip without their image variables.
        #
        # Workaround: the packages in `known_failures` have tests that fail on
        # this platform today because of the causes in the comments below.
        # The blocking run leaves them out so that every other package blocks
        # CI. A second, non-blocking run still tests them and reports each one
        # that passes. Remove a package from the list in the change that fixes
        # its failures on this platform; remove the list when it is empty. The
        # run fails when a listed package no longer exists.
        shell: bash
        run: |
          set -euo pipefail
          module=github.com/delinoio/mono
          case "$RUNNER_OS" in
            macOS)
              known_failures=(
                # The process test runtime runs only guests of the host OS,
                # but the tests create Linux guests, and the guest helper
                # socket paths under the macOS TMPDIR exceed the 104-byte unix
                # socket path limit, so every sandbox create fails.
                cmds/ownsand-agent
                cmds/ownsand-agent/internal/agent
                cmds/ownsand-agent/internal/dataplane
                cmds/ownsand-agent/internal/ops
                # The exec test compares the working directory with the
                # TMPDIR path, which macOS reports as `/private/var/...`.
                cmds/ownsand-guest/guest
              )
              ;;
            Windows)
              known_failures=(
                # The read snapshot does not abort when the path is swapped
                # before open.
                cmds/ownsand-guest/guest
                # The peer-to-peer data channel never opens, so the
                # peer-to-peer tests time out.
                go/ownsand
                # The tar escape checks accept links such as `/etc/passwd`,
                # which are not absolute paths on Windows.
                internal/fsutil
                # The HTTP observer receives no response for a request that
                # starts with CRLF after a POST.
                servers/accounts-api/internal/server
                # The relay test that blocks socket writes ends with
                # `context canceled` before the idle timeout.
                servers/ownsand-api/internal/api
              )
              ;;
            *)
              echo "::error::Unexpected runner OS $RUNNER_OS"
              exit 1
              ;;
          esac
          # macOS runners run bash 3.2, which has no `mapfile`. The command
          # substitution keeps a `go list` failure fatal under `set -e`.
          package_list="$(go list ./...)"
          all_packages=()
          while IFS= read -r package; do
            all_packages+=("$package")
          done <<< "$package_list"
          skipped=()
          for package in "${known_failures[@]}"; do
            if [[ ! " ${all_packages[*]} " == *" $module/$package "* ]]; then
              echo "::error::Known failing package $module/$package does not exist; remove it from the list"
              exit 1
            fi
            skipped+=("$module/$package")
          done
          tested=()
          for package in "${all_packages[@]}"; do
            if [[ ! " ${skipped[*]} " == *" $package "* ]]; then
              tested+=("$package")
            fi
          done
          {
            echo "Packages left out of the blocking run: ${#skipped[@]}"
            printf -- '- %s\n' "${skipped[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          go test -count=1 "${tested[@]}" || status=$?
          echo "::group::Known failing packages (non-blocking)"
          for package in "${skipped[@]}"; do
            if go test -count=1 "$package"; then
              echo "::notice::$package passes on $RUNNER_OS; remove it from the known failures"
              echo "Known failing package passed: $package" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "::endgroup::"
          exit "$status"
      - name: Record validation result
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          PLATFORM: ${{ matrix.platform }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo "Platform: $PLATFORM ($(go env GOOS)/$(go env GOARCH))"
            echo 'Commands in the root Go module: go vet ./...; go vet ./... for the other architecture (macOS: with and without cgo); go test -count=1 for every package except the known failing packages listed above, without Postgres, then a non-blocking go test of each known failing package'
            echo "Result: $RESULT"
            echo 'Scope: compile, vet and unit tests on the hosted runner. Postgres-backed tests, the OwnSand end-to-end suite, Virtualization.framework and Hyper-V VM boots, code signing and device acceptance: not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  rust-fmt:
    name: Rust formatting
    # Formatting checks every tracked Rust file, builds nothing and takes
    # seconds, so this job does not wait for the planner. It runs for every
    # event, and ci-result requires it to succeed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustc --version
          cargo --version
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          VALIDATION_REVISION: ${{ github.sha }}
        run: |
          {
            echo "Validation revision: $VALIDATION_REVISION"
            echo 'Commands in the root Cargo workspace: cargo fmt --all --check'
            echo "Result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
  rust-clippy:
    name: Rust clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build packages
        # Tauri and `tauri-runtime-cef` link GTK 4 on Linux. The `cef` crate
        # build script downloads the CEF distribution itself.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustc --version
          cargo --version
          # The `cef-dll-sys` build script downloads the CEF distribution into
          # `$CEF_PATH/<version>` when that directory is missing, and reuses it
          # otherwise. Keep it outside `target/` so the Rust cache stores it.
          echo "CEF_PATH=$HOME/.cache/cef" >> "$GITHUB_ENV"
      - name: Restore Rust and CEF cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.cache/cef
          # The cache key includes the job ID, so the clippy and test jobs,
          # which write different `target/` content, keep separate entries.
          # Only main pushes save the cache. Pull requests restore the main
          # cache and do not use the repository cache quota for their builds.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint Rust workspace with clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands in the root Cargo workspace: cargo clippy --workspace --all-targets --locked -- -D warnings'
            echo "Result: $RESULT"
            echo 'Scope: Linux desktop target only. Tauri bundles, macOS, Windows, Android, iOS, app launch and release acceptance: not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  rust-test:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build packages
        # Tauri and `tauri-runtime-cef` link GTK 4 on Linux. The `cef` crate
        # build script downloads the CEF distribution itself.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal
          rustc --version
          cargo --version
          # The `cef-dll-sys` build script downloads the CEF distribution into
          # `$CEF_PATH/<version>` when that directory is missing, and reuses it
          # otherwise. Keep it outside `target/` so the Rust cache stores it.
          echo "CEF_PATH=$HOME/.cache/cef" >> "$GITHUB_ENV"
      - name: Restore Rust and CEF cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.cache/cef
          # The cache key includes the job ID, so the clippy and test jobs,
          # which write different `target/` content, keep separate entries.
          # Only main pushes save the cache. Pull requests restore the main
          # cache and do not use the repository cache quota for their builds.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands in the root Cargo workspace: cargo test --workspace --locked'
            echo "Result: $RESULT"
            echo 'Scope: Linux desktop target only. Tauri bundles, macOS, Windows, Android, iOS, app launch and release acceptance: not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  rust-platforms:
    name: Rust on ${{ matrix.platform }}
    # The delidev desktop app links CEF on macOS and Windows differently from
    # Linux (a framework on macOS, import libraries and runtime DLLs on
    # Windows), so the Linux rust-clippy and rust-test jobs do not cover them.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      # Report the failures of every platform in one run.
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
          - platform: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Keep the repository line endings in the Windows checkout
        # Git for Windows on the runner image sets `core.autocrlf=true`; Tauri
        # compiles the checked-out configuration and capabilities into the
        # binary, so keep the bytes that the Linux jobs build.
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        # The macOS and Windows runner images include CMake and Ninja, which
        # the `cef-dll-sys` build script uses for the CEF C++ wrapper.
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustc --version
          cargo --version
          cmake --version
          ninja --version
          # The `cef-dll-sys` build script downloads the CEF distribution into
          # `$CEF_PATH/<version>` when that directory is missing, and reuses it
          # otherwise. Keep it outside `target/` so the Rust cache stores it.
          # The build script is a native Windows program, so pass it a Windows
          # path instead of the MSYS path of Git Bash.
          cef_path="$HOME/.cache/cef"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cef_path="$(cygpath -w "$cef_path")"
          fi
          echo "CEF_PATH=$cef_path" >> "$GITHUB_ENV"
      - name: Restore Rust and CEF cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The job ID is the same for every matrix entry, so add the runner
          # to the key. Only main pushes save the cache.
          key: ${{ matrix.runner }}
          cache-directories: ~/.cache/cef
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint Rust workspace with clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Record validation result
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          PLATFORM: ${{ matrix.platform }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo "Platform: $PLATFORM desktop target"
            echo 'Commands in the root Cargo workspace: cargo clippy --workspace --all-targets --locked -- -D warnings; cargo test --workspace --locked'
            echo "Result: $RESULT"
            echo 'Scope: host desktop target only. Tauri bundles, code signing, notarization, Android, iOS, app launch and release acceptance: not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm --filter delino-accounts exec e2e-web install chromium --with-deps
      - name: Run e2e suites
        id: run
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Pull requests from forks receive no secrets. Agent steps need the
          # model key, so those runs exclude tests tagged `agent`.
          if [[ -n "${AI_GATEWAY_API_KEY:-}" ]]; then
            echo "agent=included" >> "$GITHUB_OUTPUT"
            pnpm test:e2e -- --reporter list,junit
          else
            echo "agent=excluded" >> "$GITHUB_OUTPUT"
            echo "::notice::AI_GATEWAY_API_KEY is not available; tests tagged agent are excluded."
            pnpm test:e2e -- --reporter list,junit --exclude-tag agent
          fi
      - name: Upload e2e results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          # The runner writes its output under the hidden `.e2e/` directory, and
          # upload-artifact skips hidden paths unless this input is true.
          include-hidden-files: true
          path: |
            apps/*/.e2e/report.json
            apps/*/.e2e/junit.xml
            apps/*/.e2e/results
            apps/*/.e2e/logs
          if-no-files-found: warn
          retention-days: 7
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          AGENT_TESTS: ${{ steps.run.outputs.agent }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands: pnpm install --frozen-lockfile --ignore-scripts; e2e-web install chromium --with-deps; pnpm test:e2e -- --reporter list,junit [--exclude-tag agent]'
            echo "Agent-tagged tests: ${AGENT_TESTS:-not run}"
            echo "Result: $RESULT"
            echo 'Scope: development servers in headless Chromium. Production build, Cloudflare Pages, account and release acceptance: not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  workspace-packages:
    name: Workspace packages
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # No package outside servers/ calls Go today. The go.mod toolchain is set
      # up anyway, so a package that starts to call Go does not silently use
      # the preinstalled runner Go of another version.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The go-test job owns the Go cache. setup-go cannot restore without
          # saving, and both jobs would save different caches under one key.
          cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build, lint, typecheck and test workspace packages outside servers/
        # Every selected package runs: `--affected` selects no package when
        # only a root input such as `package.json`, `turbo.json` or `go.mod`
        # changes. The workspace-packages and workspace-servers filters are
        # complements, so together they select every package, including a
        # package added under a new workspace root. `--continue` reports the
        # failures of every package in one run.
        run: pnpm exec turbo run build lint typecheck test --continue '--filter=!./servers/*'
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo "Commands: pnpm install --frozen-lockfile --ignore-scripts; pnpm exec turbo run build lint typecheck test --continue '--filter=!./servers/*'"
            echo "Result: $RESULT"
            echo 'Scope: package build output, lint, typecheck and unit tests without a database. Deployment, Tauri bundles, app launch and release acceptance: not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  workspace-servers:
    name: Workspace servers
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The server packages wrap the Go toolchain in their package scripts.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The go-test job owns the Go cache. setup-go cannot restore without
          # saving, and both jobs would save different caches under one key.
          cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build, lint, typecheck and test server packages
        # Every selected package runs: `--affected` selects no package when
        # only a root input such as `package.json`, `turbo.json` or `go.mod`
        # changes. The workspace-packages and workspace-servers filters are
        # complements, so together they select every package, including a
        # package added under a new workspace root. `--continue` reports the
        # failures of every package in one run.
        run: pnpm exec turbo run build lint typecheck test --continue '--filter=./servers/*'
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo "Commands: pnpm install --frozen-lockfile --ignore-scripts; pnpm exec turbo run build lint typecheck test --continue '--filter=./servers/*'"
            echo "Result: $RESULT"
            echo 'Scope: package build output, lint, typecheck and unit tests without a database. Deployment, Tauri bundles, app launch and release acceptance: not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Lint workflows with actionlint
        # actionlint also runs the shellcheck of the Ubuntu runner image on
        # every `run:` script.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Report findings as annotations and fail the step; do not upload
          # SARIF, which would need `security-events: write`.
          advanced-security: false
          annotations: true
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 (with the runner shellcheck); zizmor 1.32.0 through zizmorcore/zizmor-action v0.8.1 with online audits'
            echo "Result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
  ci-result:
    if: always()
    needs:
      [
        changes,
        quality,
        go-fmt,
        go-vet,
        go-test,
        protos,
        go-platforms,
        rust-fmt,
        rust-clippy,
        rust-test,
        rust-platforms,
        e2e,
        workspace-packages,
        workspace-servers,
        workflows,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check validation results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
          VALIDATION_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The planner output that selects each validation job. Keep exactly
          # one entry for each job in `needs` other than `changes`: the check
          # fails when the two job lists differ, so a new job cannot pass
          # without an entry. A skipped job passes only when the planner did
          # not select its output. `always` marks a job that runs without the
          # planner; that job must succeed.
          job_outputs='{
            "quality": "quality",
            "go-fmt": "always",
            "go-vet": "go",
            "go-test": "go",
            "protos": "go",
            "go-platforms": "go",
            "rust-fmt": "always",
            "rust-clippy": "rust",
            "rust-test": "rust",
            "rust-platforms": "rust",
            "e2e": "e2e",
            "workspace-packages": "workspace",
            "workspace-servers": "workspace",
            "workflows": "workflows"
          }'
          echo "Validation revision: $VALIDATION_REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$NEEDS_RESULTS" | jq -e --argjson outputs "$job_outputs" '
            .changes.result == "success"
            and ((keys - ["changes"]) == ($outputs | keys))
            and (.changes.outputs as $planned
              | del(.changes)
              | to_entries
              | all(.value.result == "success"
                or (.value.result == "skipped"
                  and $outputs[.key] != "always"
                  and $planned[$outputs[.key]] == "false")))
          ' > /dev/null; then
            echo 'CI result: success' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'CI result: failure' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
