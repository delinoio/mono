name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Optional base revision for affected validation
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Each job timeout is at least three times the longest observed run without
  # caches, so a hung service, download or test fails the job instead of
  # running until the six-hour default.
  changes:
    name: Plan affected CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.comparison.outputs.base }}
      head: ${{ steps.comparison.outputs.head }}
      quality: ${{ steps.plan.outputs.quality }}
      format: ${{ steps.plan.outputs.format }}
      fixtures: ${{ steps.plan.outputs.fixtures }}
      go: ${{ steps.plan.outputs.go }}
      rust: ${{ steps.plan.outputs.rust }}
      e2e: ${{ steps.plan.outputs.e2e }}
      workspace: ${{ steps.plan.outputs.workspace }}
      workflows: ${{ steps.plan.outputs.workflows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Resolve affected comparison
        id: comparison
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push)
              base="$PUSH_BASE"
              if [[ "$base" =~ ^0+$ ]]; then
                empty_tree="$(git hash-object -t tree /dev/null)"
                base="$(git -c user.name=CI -c user.email=ci@example.invalid commit-tree "$empty_tree" -m 'Empty comparison')"
              fi
              ;;
            workflow_dispatch)
              if [[ -n "$MANUAL_BASE" ]]; then
                base="$(git rev-parse --verify --end-of-options "${MANUAL_BASE}^{commit}")"
              else
                base="$(git merge-base origin/main "$head")"
              fi
              ;;
            *) exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Validation revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Comparison: $base..$head" >> "$GITHUB_STEP_SUMMARY"
      - name: Select affected validation
        id: plan
        env:
          CI_BASE: ${{ steps.comparison.outputs.base }}
          CI_HEAD: ${{ steps.comparison.outputs.head }}
        run: node scripts/ci/plan.mjs
  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        if: needs.changes.outputs.format == 'true'
        env:
          TURBO_SCM_BASE: ${{ needs.changes.outputs.base }}
          TURBO_SCM_HEAD: ${{ needs.changes.outputs.head }}
        run: pnpm format:check
      # The workspace package tests run in the `workspace` job.
      - name: Test formatting, hooks and CI scripts
        if: needs.changes.outputs.fixtures == 'true'
        run: pnpm test:tooling
      - name: Validate pending changesets
        # Runs `changeset version` when a changeset is pending; it rewrites
        # files of this throwaway checkout, so it runs last.
        if: needs.changes.outputs.fixtures == 'true'
        run: scripts/ci/validate-changesets.sh
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          FORMAT_PLANNED: ${{ needs.changes.outputs.format }}
          FIXTURES_PLANNED: ${{ needs.changes.outputs.fixtures }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo "Planned: format=$FORMAT_PLANNED; fixtures=$FIXTURES_PLANNED"
            echo 'Commands (when planned): pnpm install --frozen-lockfile --ignore-scripts; pnpm format:check; pnpm test:tooling; scripts/ci/validate-changesets.sh (pending changeset validation)'
            echo "Result: $RESULT"
            echo 'Runtime, account, native platform and release acceptance: not performed. The workspace job builds the app packages; CI does not deploy them.'
          } >> "$GITHUB_STEP_SUMMARY"
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres for the Postgres-backed ownsand-api tests and the OwnSand
    # end-to-end suite (servers/ownsand-api/e2e). The credentials exist only
    # inside this job.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Caches the Go module and build caches, keyed by the `go.sum` hash.
          # Only this job saves them under that key; the workspace job does not
          # use them, and the protos job keys its cache by other files, so no
          # two jobs race to save different caches under one key.
          cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      # Installed before the Go tests: the OwnSand end-to-end suite runs the
      # TypeScript SDK test with rstest.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Go module
        shell: bash
        env:
          OWNSAND_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
          OWNSAND_E2E: "1"
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 --no-run-if-empty gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt reports unformatted files"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          # -count=1 bypasses cached test results, so every run executes the
          # tests; the restored build cache only skips recompilation.
          go test -count=1 ./...
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands in the root Go module: pnpm install --frozen-lockfile --ignore-scripts; gofmt -l on tracked .go files; go vet ./...; go test -count=1 ./... with a Postgres service, OWNSAND_TEST_DATABASE_URL and OWNSAND_E2E=1 (Postgres-backed ownsand-api tests and the OwnSand end-to-end suite with the process runtime)'
            echo "Result: $RESULT"
            echo 'Runtime, deployment and release acceptance: not performed. The OwnSand end-to-end suite uses the process test runtime, not a hypervisor. The protos job checks the protobuf schemas and bindings.'
          } >> "$GITHUB_STEP_SUMMARY"
  protos:
    needs: changes
    # Every protobuf input is also a Go input, so the planner's `go` output
    # selects this job. It runs next to the go job instead of after its tests.
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The protobuf breaking-change check reads the comparison base.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Caches the buf CLI and protoc plugin builds that `go run` makes.
          # The key hashes the files that pin their versions, not `go.sum`,
          # so this cache and the go job cache have different keys and the
          # two jobs never race to save one key.
          cache: true
          cache-dependency-path: |
            scripts/protos.sh
            protos/buf.gen.yaml
      # scripts/protos.sh check also generates the TypeScript bindings with the
      # protoc-gen-es version that packages/ownsand-sdk pins.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check protobuf schemas and generated Go and TypeScript bindings
        shell: bash
        env:
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -euo pipefail
          scripts/protos.sh check
          # A root push compares against an empty-tree commit that only the
          # changes job created; it has no schemas to compare.
          if git cat-file -e "${COMPARISON_BASE}^{commit}" 2>/dev/null; then
            scripts/protos.sh breaking "$COMPARISON_BASE"
          else
            echo "Comparison base $COMPARISON_BASE is not in this checkout; breaking-change check skipped."
            echo "Protobuf breaking-change check: skipped, comparison base not in checkout" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands: pnpm install --frozen-lockfile --ignore-scripts; scripts/protos.sh check (buf lint, buf format and the Go and TypeScript binding drift check); scripts/protos.sh breaking <base>'
            echo "Result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # The lint and test checks build the workspace separately on their own
      # runners, so they run in parallel instead of one after the other.
      # A failed check does not cancel the other, so one run reports both.
      fail-fast: false
      matrix:
        check: [lint, test]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build packages
        # Tauri and `tauri-runtime-cef` link GTK 4 on Linux. The `cef` crate
        # build script downloads the CEF distribution itself.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version
          # The `cef-dll-sys` build script downloads the CEF distribution into
          # `$CEF_PATH/<version>` when that directory is missing, and reuses it
          # otherwise. Keep it outside `target/` so the Rust cache stores it.
          echo "CEF_PATH=$HOME/.cache/cef" >> "$GITHUB_ENV"
      - name: Restore Rust and CEF cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: ~/.cache/cef
          # Clippy and the test build write different `target/` content, so
          # each check keeps its own cache entry.
          key: ${{ matrix.check }}
          # Only main pushes save the cache. Pull requests restore the main
          # cache and do not use the repository cache quota for their builds.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Rust workspace
        id: check
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          case "$CHECK" in
            lint)
              commands='cargo fmt --all --check; cargo clippy --workspace --all-targets --locked -- -D warnings'
              echo "commands=$commands" >> "$GITHUB_OUTPUT"
              cargo fmt --all --check
              cargo clippy --workspace --all-targets --locked -- -D warnings
              ;;
            test)
              commands='cargo test --workspace --locked'
              echo "commands=$commands" >> "$GITHUB_OUTPUT"
              cargo test --workspace --locked
              ;;
            *)
              echo "::error::Unknown Rust check: $CHECK"
              exit 1
              ;;
          esac
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          CHECK: ${{ matrix.check }}
          COMMANDS: ${{ steps.check.outputs.commands }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo "Rust check: $CHECK"
            echo "Commands in the root Cargo workspace: ${COMMANDS:-not started}"
            echo "Result: $RESULT"
            echo 'Scope: Linux desktop target only. Tauri bundles, macOS, Windows, Android, iOS, app launch and release acceptance: not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm --filter delino-accounts exec e2e-web install chromium --with-deps
      - name: Run e2e suites
        id: run
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Pull requests from forks receive no secrets. Agent steps need the
          # model key, so those runs exclude tests tagged `agent`.
          if [[ -n "${AI_GATEWAY_API_KEY:-}" ]]; then
            echo "agent=included" >> "$GITHUB_OUTPUT"
            pnpm test:e2e -- --reporter list,junit
          else
            echo "agent=excluded" >> "$GITHUB_OUTPUT"
            echo "::notice::AI_GATEWAY_API_KEY is not available; tests tagged agent are excluded."
            pnpm test:e2e -- --reporter list,junit --exclude-tag agent
          fi
      - name: Upload e2e results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          # The runner writes its output under the hidden `.e2e/` directory, and
          # upload-artifact skips hidden paths unless this input is true.
          include-hidden-files: true
          path: |
            apps/*/.e2e/report.json
            apps/*/.e2e/junit.xml
            apps/*/.e2e/results
            apps/*/.e2e/logs
          if-no-files-found: warn
          retention-days: 7
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          AGENT_TESTS: ${{ steps.run.outputs.agent }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands: pnpm install --frozen-lockfile --ignore-scripts; e2e-web install chromium --with-deps; pnpm test:e2e -- --reporter list,junit [--exclude-tag agent]'
            echo "Agent-tagged tests: ${AGENT_TESTS:-not run}"
            echo "Result: $RESULT"
            echo 'Scope: development servers in headless Chromium. Production build, Cloudflare Pages, account and release acceptance: not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  workspace:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The server packages wrap the Go toolchain in their package scripts.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The go job owns the Go cache. setup-go cannot restore without
          # saving, and both jobs would save different caches under one key.
          cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store, keyed by the `pnpm-lock.yaml` hash.
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build, lint, typecheck and test workspace packages
        # Every package runs: `--affected` selects no package when only a root
        # input such as `package.json`, `turbo.json` or `go.mod` changes.
        # `--continue` reports the failures of every package in one run.
        run: pnpm exec turbo run build lint typecheck test --continue
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands: pnpm install --frozen-lockfile --ignore-scripts; pnpm exec turbo run build lint typecheck test --continue (every workspace package)'
            echo "Result: $RESULT"
            echo 'Scope: package build output, lint, typecheck and unit tests without a database. Deployment, Tauri bundles, app launch and release acceptance: not performed.'
          } >> "$GITHUB_STEP_SUMMARY"
  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Lint workflows with actionlint
        # actionlint also runs the shellcheck of the Ubuntu runner image on
        # every `run:` script.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Report findings as annotations and fail the step; do not upload
          # SARIF, which would need `security-events: write`.
          advanced-security: false
          annotations: true
      - name: Record validation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          COMPARISON_BASE: ${{ needs.changes.outputs.base }}
          COMPARISON_HEAD: ${{ needs.changes.outputs.head }}
        run: |
          {
            echo "Comparison: $COMPARISON_BASE..$COMPARISON_HEAD"
            echo 'Commands: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 (with the runner shellcheck); zizmor 1.32.0 through zizmorcore/zizmor-action v0.8.1 with online audits'
            echo "Result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
  ci-result:
    if: always()
    needs: [changes, quality, go, protos, rust, e2e, workspace, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check validation results
        env:
          QUALITY_PLANNED: ${{ needs.changes.outputs.quality }}
          GO_PLANNED: ${{ needs.changes.outputs.go }}
          RUST_PLANNED: ${{ needs.changes.outputs.rust }}
          E2E_PLANNED: ${{ needs.changes.outputs.e2e }}
          WORKSPACE_PLANNED: ${{ needs.changes.outputs.workspace }}
          WORKFLOWS_PLANNED: ${{ needs.changes.outputs.workflows }}
          NEEDS_RESULTS: ${{ toJSON(needs) }}
          VALIDATION_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Validation revision: $VALIDATION_REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$NEEDS_RESULTS" | jq -e --arg planned "$QUALITY_PLANNED" --arg go_planned "$GO_PLANNED" --arg rust_planned "$RUST_PLANNED" --arg e2e_planned "$E2E_PLANNED" --arg workspace_planned "$WORKSPACE_PLANNED" --arg workflows_planned "$WORKFLOWS_PLANNED" 'all(.[]; .result == "success" or .result == "skipped") and .changes.result == "success" and (.quality.result == "success" or (.quality.result == "skipped" and $planned == "false")) and (.go.result == "success" or (.go.result == "skipped" and $go_planned == "false")) and (.protos.result == "success" or (.protos.result == "skipped" and $go_planned == "false")) and (.rust.result == "success" or (.rust.result == "skipped" and $rust_planned == "false")) and (.e2e.result == "success" or (.e2e.result == "skipped" and $e2e_planned == "false")) and (.workspace.result == "success" or (.workspace.result == "skipped" and $workspace_planned == "false")) and (.workflows.result == "success" or (.workflows.result == "skipped" and $workflows_planned == "false"))' > /dev/null; then
            echo 'CI result: success' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'CI result: failure' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
