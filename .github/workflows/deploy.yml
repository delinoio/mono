name: Deploy
# Deploys the packages selected by the pending changesets on `main`, in
# dependency order: servers (Railway) first, then static sites (Cloudflare
# Pages). The PlanetScale Postgres database has no migration job yet; see
# docs/repository-workflow-contract.md#deployment-workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  plan:
    name: Plan deployment
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      releases: ${{ steps.plan.outputs.releases }}
      servers: ${{ steps.plan.outputs.servers }}
      static_sites: ${{ steps.plan.outputs.static_sites }}
      has_changesets: ${{ steps.plan.outputs.has_changesets }}
      has_servers: ${{ steps.plan.outputs.has_servers }}
      has_static_sites: ${{ steps.plan.outputs.has_static_sites }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Deploy runs only on refs/heads/main, not $REF."
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Read the current `main`, not the dispatch SHA. A run that waited in
          # the `deploy` concurrency queue must not see changesets that the
          # previous run already consumed. Later jobs use the recorded SHA.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record the deployed revision
        id: revision
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deployed revision: $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Read pending changesets
        run: pnpm exec changeset status --output "$RUNNER_TEMP/changeset-status.json"
      - name: Select and order deployables
        id: plan
        run: node scripts/ci/deploy-plan.mjs "$RUNNER_TEMP/changeset-status.json"

  build-servers:
    name: Build ${{ matrix.server.name }}
    needs: plan
    if: needs.plan.outputs.has_servers == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every server builds in parallel. One failed build stops the run before
      # any server is deployed.
      fail-fast: true
      matrix:
        server: ${{ fromJSON(needs.plan.outputs.servers) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        env:
          NAME: ${{ matrix.server.name }}
          # Railway runs linux/amd64 containers on a distroless static base.
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: pnpm exec turbo run build --filter="$NAME"
      - name: Assemble the Railway build context
        env:
          DIR: ${{ matrix.server.dir }}
          NAME: ${{ matrix.server.name }}
        shell: bash
        run: |
          set -euo pipefail
          for file in Dockerfile railway.json; do
            if [[ ! -f "$DIR/$file" ]]; then
              echo "::error::$NAME has no $DIR/$file."
              exit 1
            fi
          done
          context="$RUNNER_TEMP/context"
          mkdir -p "$context"
          cp "$DIR/Dockerfile" "$DIR/railway.json" "$context/"
          cp -R "$DIR/dist" "$context/dist"
          # A tar archive keeps the executable mode, which artifacts drop.
          tar -czf "$RUNNER_TEMP/$NAME.tar.gz" -C "$context" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.server.name }}
          path: ${{ runner.temp }}/${{ matrix.server.name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-servers:
    name: Deploy servers
    needs: [plan, build-servers]
    if: needs.plan.outputs.has_servers == 'true'
    runs-on: ubuntu-latest
    environment: servers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          path: ${{ runner.temp }}/servers
          merge-multiple: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the Railway CLI
        run: npm install --global @railway/cli@5.69.0
      - name: Deploy in dependency order
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVERS: ${{ needs.plan.outputs.servers }}
          SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::error::The servers environment has no RAILWAY_TOKEN secret."
            exit 1
          fi
          echo "## Servers" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r name version service; do
            context="$RUNNER_TEMP/context-$name"
            mkdir -p "$context"
            tar -xzf "$RUNNER_TEMP/servers/$name.tar.gz" -C "$context"
            echo "::group::Deploy $name@$version to Railway service $service"
            # --ci waits for the deployment result and exits non-zero when the
            # build or the deployment fails.
            railway up "$context" --path-as-root --no-gitignore --ci \
              --service "$service" --message "$name@$version ($SHA)"
            echo "::endgroup::"
            echo "- $name@$version: Railway service \`$service\`" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | [.name, .version, .service] | @tsv' <<< "$SERVERS")

  deploy-static-sites:
    name: Deploy static sites
    needs: [plan, deploy-servers]
    # Run after the servers, also when no server was selected.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.has_static_sites == 'true' }}
    runs-on: ubuntu-latest
    environment: static-sites
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Wrangler
        run: npm install --global wrangler@4.154.0
      - name: Build and deploy in dependency order
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITES: ${{ needs.plan.outputs.static_sites }}
          SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for secret in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error::The static-sites environment has no $secret secret."
              exit 1
            fi
          done
          echo "## Static sites" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r name version project output; do
            echo "::group::Build and deploy $name@$version to Cloudflare Pages project $project"
            pnpm exec turbo run build --filter="$name"
            wrangler pages deploy "$output" --project-name "$project" \
              --branch main --commit-hash "$SHA" \
              --commit-message "$name@$version"
            echo "::endgroup::"
            echo "- $name@$version: Cloudflare Pages project \`$project\`" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | [.name, .version, .project, .output] | @tsv' <<< "$SITES")

  release:
    name: Version and tag
    needs: [plan, build-servers, deploy-servers, deploy-static-sites]
    # Run only after every selected deployment succeeded. Skipped deployments
    # (no server or no static site selected) do not block the release.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.has_changesets == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit versions, tag and push
        env:
          RELEASES: ${{ needs.plan.outputs.releases }}
          SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t tags < <(jq -r '.[] | "\(.name)@\(.version)"' <<< "$RELEASES")

          # Consume exactly the changesets that this run deployed. A version
          # bump can change a `workspace:<version>` range, so refresh the
          # lockfile in the same commit to keep frozen installs working.
          pnpm exec changeset version
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          git add -A
          {
            printf 'chore(release): version deployed packages\n\n'
            printf 'Deployed revision: %s\n' "$SHA"
            if (( ${#tags[@]} > 0 )); then
              printf '\n'
              printf -- '- %s\n' "${tags[@]}"
            fi
          } > "$RUNNER_TEMP/commit-message"
          git commit --quiet --file="$RUNNER_TEMP/commit-message"

          tag_head() {
            local tag
            for tag in "${tags[@]}"; do
              git tag --force --annotate "$tag" --message "$tag deployed from $SHA"
            done
          }

          # Push the version commit and every tag atomically, so a rejected
          # push leaves neither on the remote. Only a moved `main` is retried:
          # the same version commit is cherry-picked onto the new `main`
          # (changesets merged later stay pending). Any other rejection, such
          # as a ruleset denial or an existing tag, fails at once.
          tag_head
          max_attempts=3
          for (( attempt = 1; ; attempt++ )); do
            refspecs=(HEAD:refs/heads/main)
            for tag in "${tags[@]}"; do refspecs+=("refs/tags/$tag"); done
            if git push --atomic origin "${refspecs[@]}"; then
              {
                echo "## Release"
                echo "Version commit: $(git rev-parse HEAD)"
                if (( ${#tags[@]} > 0 )); then
                  printf -- '- `%s`\n' "${tags[@]}"
                else
                  echo "No tags: every release kept its version."
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git fetch --quiet origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "::error::The push was rejected although main did not move. Check the main ruleset and existing tags."
              exit 1
            fi
            if (( attempt >= max_attempts )); then
              echo "::error::main kept moving; the version commit and tags were not pushed after $max_attempts attempts."
              exit 1
            fi
            echo "::warning::main moved during the deployment; replaying the version commit (attempt $attempt of $max_attempts)."
            version_commit="$(git rev-parse HEAD)"
            git reset --quiet --hard origin/main
            git cherry-pick "$version_commit"
            tag_head
          done
