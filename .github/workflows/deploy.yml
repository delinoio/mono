name: Deploy
# Deploys the packages selected by the pending changesets on `main`, in
# dependency order: servers (Railway) first, then static sites (Cloudflare
# Pages). The PlanetScale Postgres database has no migration job yet; see
# docs/repository-workflow-contract.md#deployment-workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
  # The stale-plan check lists the runs of this workflow.
  actions: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  plan:
    name: Plan deployment
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      releases: ${{ steps.plan.outputs.releases }}
      servers: ${{ steps.plan.outputs.servers }}
      static_sites: ${{ steps.plan.outputs.static_sites }}
      changeset_blobs: ${{ steps.blobs.outputs.changeset_blobs }}
      has_changesets: ${{ steps.plan.outputs.has_changesets }}
      has_servers: ${{ steps.plan.outputs.has_servers }}
      has_static_sites: ${{ steps.plan.outputs.has_static_sites }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Deploy runs only on refs/heads/main, not $REF."
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Read the current `main`, not the dispatch SHA. A run that waited in
          # the `deploy` concurrency queue must not see changesets that the
          # previous run already consumed. Later jobs use the recorded SHA.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record the deployed revision
        id: revision
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deployed revision: $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Read pending changesets
        run: pnpm exec changeset status --output "$RUNNER_TEMP/changeset-status.json"
      - name: Select and order deployables
        id: plan
        run: node scripts/ci/deploy-plan.mjs "$RUNNER_TEMP/changeset-status.json"
      - name: Record the planned changeset files
        id: blobs
        env:
          CHANGESETS: ${{ steps.plan.outputs.changesets }}
        shell: bash
        run: |
          set -euo pipefail
          blobs='{}'
          while read -r id; do
            blob="$(git rev-parse "HEAD:.changeset/$id.md")"
            blobs="$(jq -c --arg id "$id" --arg blob "$blob" '. + {($id): $blob}' <<< "$blobs")"
          done < <(jq -r '.[]' <<< "$CHANGESETS")
          echo "changeset_blobs=$blobs" >> "$GITHUB_OUTPUT"

  build-servers:
    name: Build ${{ matrix.server.name }}
    needs: plan
    if: needs.plan.outputs.has_servers == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every server builds in parallel. One failed build stops the run before
      # any server is deployed.
      fail-fast: true
      matrix:
        server: ${{ fromJSON(needs.plan.outputs.servers) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        env:
          NAME: ${{ matrix.server.name }}
          # Railway runs linux/amd64 containers on a distroless static base.
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: pnpm exec turbo run build --filter="$NAME"
      - name: Assemble the Railway build context
        env:
          DIR: ${{ matrix.server.dir }}
          NAME: ${{ matrix.server.name }}
        shell: bash
        run: |
          set -euo pipefail
          for file in Dockerfile railway.json; do
            if [[ ! -f "$DIR/$file" ]]; then
              echo "::error::$NAME has no $DIR/$file."
              exit 1
            fi
          done
          context="$RUNNER_TEMP/context"
          mkdir -p "$context"
          cp "$DIR/Dockerfile" "$DIR/railway.json" "$context/"
          # The runtime image must carry the FSL-1.1-ALv2 terms and notice
          # (docs/repository-license-contract.md).
          cp servers/LICENSE "$context/LICENSE"
          cp -R "$DIR/dist" "$context/dist"
          # A tar archive keeps the executable mode, which artifacts drop.
          tar -czf "$RUNNER_TEMP/$NAME.tar.gz" -C "$context" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.server.name }}
          path: ${{ runner.temp }}/${{ matrix.server.name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-servers:
    name: Deploy servers
    needs: [plan, build-servers]
    if: needs.plan.outputs.has_servers == 'true'
    runs-on: ubuntu-latest
    environment: servers
    env:
      # Railway CLI release asset, verified against the SHA-256 that GitHub
      # publishes for it. Update both values together.
      RAILWAY_CLI_VERSION: 5.69.0
      RAILWAY_CLI_SHA256: 1bd0612e743adf69b13bee7a6e49dd9bf2f0efb5f97b90f90d1b15b122a840e5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/check-pending-changesets.sh
          sparse-checkout-cone-mode: false
      - name: Check that the plan is still current
        env:
          CHANGESET_BLOBS: ${{ needs.plan.outputs.changeset_blobs }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: deploy.yml
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/check-pending-changesets.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          path: ${{ runner.temp }}/servers
          merge-multiple: true
      - name: Install the Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          asset="railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/$asset"
          echo "$RAILWAY_CLI_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bin" railway
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/railway" --version
      - name: Deploy in dependency order
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVERS: ${{ needs.plan.outputs.servers }}
          SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::error::The servers environment has no RAILWAY_TOKEN secret."
            exit 1
          fi

          # Wait for an explicit terminal status of one deployment. The exit
          # code of `railway up` alone is not a verdict: the CLI exits 0 when
          # its status stream closes before the deployment finishes.
          wait_for_deployment() {
            local service="$1" id="$2" status="" errors=0 deadline=$((SECONDS + 1800))
            while (( SECONDS < deadline )); do
              # Tolerate a few consecutive failed polls (network or API
              # errors); the deployment itself may still succeed.
              if ! status="$(railway deployment list --service "$service" --limit 20 --json < /dev/null \
                | jq -r --arg id "$id" '.[] | select(.id == $id) | .status')"; then
                if (( ++errors >= 5 )); then
                  echo "::error::Could not read the status of deployment $id of $service 5 times in a row."
                  return 1
                fi
                echo "::warning::Could not read the status of deployment $id of $service (failure $errors of 5)."
                sleep 10
                continue
              fi
              errors=0
              case "$status" in
                SUCCESS) echo "Deployment $id of $service: $status"; return 0 ;;
                FAILED | CRASHED | REMOVED | REMOVING | SKIPPED)
                  echo "::error::Deployment $id of $service ended with status $status."
                  railway logs "$id" --service "$service" --build --lines 200 < /dev/null || true
                  railway logs "$id" --service "$service" --deployment --lines 200 < /dev/null || true
                  return 1
                  ;;
              esac
              echo "Deployment $id of $service: ${status:-not listed yet}"
              sleep 10
            done
            echo "::error::Deployment $id of $service did not finish within 30 minutes (last status: ${status:-unknown})."
            return 1
          }

          echo "## Servers" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r -u 3 name version service; do
            context="$RUNNER_TEMP/context-$name"
            mkdir -p "$context"
            tar -xzf "$RUNNER_TEMP/servers/$name.tar.gz" -C "$context"
            echo "::group::Deploy $name@$version to Railway service $service"
            id="$(railway up "$context" --path-as-root --no-gitignore --detach --json \
              --service "$service" --message "$name@$version ($SHA)" < /dev/null \
              | jq -R -r 'fromjson? | objects | select(.deploymentId != null) | .deploymentId' | tail -n 1)"
            if [[ -z "$id" ]]; then
              echo "::error::railway up returned no deployment id for $name."
              exit 1
            fi
            wait_for_deployment "$service" "$id"
            echo "::endgroup::"
            echo "- $name@$version: Railway service \`$service\`, deployment \`$id\`" >> "$GITHUB_STEP_SUMMARY"
          done 3< <(jq -r '.[] | [.name, .version, .service] | @tsv' <<< "$SERVERS")

  deploy-static-sites:
    name: Deploy static sites
    needs: [plan, deploy-servers]
    # Run after the servers, also when no server was selected.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.has_static_sites == 'true' }}
    runs-on: ubuntu-latest
    environment: static-sites
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Check that the plan is still current
        env:
          CHANGESET_BLOBS: ${{ needs.plan.outputs.changeset_blobs }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: deploy.yml
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/check-pending-changesets.sh
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Wrangler is a root devDependency, so the lockfile pins it.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and deploy in dependency order
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITES: ${{ needs.plan.outputs.static_sites }}
          SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for secret in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error::The static-sites environment has no $secret secret."
              exit 1
            fi
          done

          # Wait until the deploy stage of one Pages deployment succeeds.
          # Wrangler exits 0 when it cannot determine the final status, so
          # its exit code alone is not a verdict.
          wait_for_deployment() {
            local project="$1" id="$2" stage="" errors=0 deadline=$((SECONDS + 600))
            while (( SECONDS < deadline )); do
              # Tolerate a few consecutive failed polls (network or API
              # errors); the deployment itself may still succeed.
              if ! stage="$(curl -fsS --retry 3 \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/deployments/$id" \
                | jq -r '.result.latest_stage | "\(.name) \(.status)"')"; then
                if (( ++errors >= 5 )); then
                  echo "::error::Could not read the status of deployment $id of $project 5 times in a row."
                  return 1
                fi
                echo "::warning::Could not read the status of deployment $id of $project (failure $errors of 5)."
                sleep 5
                continue
              fi
              errors=0
              case "$stage" in
                "deploy success") echo "Deployment $id of $project: $stage"; return 0 ;;
                *" failure" | *" canceled")
                  echo "::error::Deployment $id of $project ended with stage $stage."
                  return 1
                  ;;
              esac
              echo "Deployment $id of $project: $stage"
              sleep 5
            done
            echo "::error::Deployment $id of $project did not finish within 10 minutes (last stage: ${stage:-unknown})."
            return 1
          }

          echo "## Static sites" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r -u 3 name version project output; do
            echo "::group::Build and deploy $name@$version to Cloudflare Pages project $project"
            pnpm exec turbo run build --filter="$name" < /dev/null
            result="$RUNNER_TEMP/wrangler-$name.ndjson"
            WRANGLER_OUTPUT_FILE_PATH="$result" pnpm exec wrangler pages deploy "$output" \
              --project-name "$project" --branch main --commit-hash "$SHA" \
              --commit-message "$name@$version" < /dev/null
            id="$(jq -r 'select(.type == "pages-deploy") | .deployment_id' "$result" | tail -n 1)"
            if [[ -z "$id" ]]; then
              echo "::error::wrangler pages deploy returned no deployment id for $name."
              exit 1
            fi
            wait_for_deployment "$project" "$id"
            echo "::endgroup::"
            echo "- $name@$version: Cloudflare Pages project \`$project\`, deployment \`$id\`" >> "$GITHUB_STEP_SUMMARY"
          done 3< <(jq -r '.[] | [.name, .version, .project, .output] | @tsv' <<< "$SITES")

  release:
    name: Version and tag
    needs: [plan, build-servers, deploy-servers, deploy-static-sites]
    # Run only after every selected deployment succeeded. Skipped deployments
    # (no server or no static site selected) do not block the release.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.has_changesets == 'true' }}
    runs-on: ubuntu-latest
    # Job permissions replace the workflow permissions, so repeat
    # `actions: read` for the stale-plan check.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Check that the plan is still current
        env:
          CHANGESET_BLOBS: ${{ needs.plan.outputs.changeset_blobs }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: deploy.yml
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/check-pending-changesets.sh
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit versions, tag and push
        env:
          RELEASES: ${{ needs.plan.outputs.releases }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/ci/deploy-release.sh
