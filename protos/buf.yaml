# SPDX-License-Identifier: Apache-2.0
# buf module of the repository protobuf schemas. scripts/protos.sh runs the
# pinned buf CLI with this configuration.
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # Workaround: the unreleased `delino.tide.v1` package was renamed to
  # `delino.sandrun.v1` before any client used it. buf reports the removed
  # `delino/tide` files of the comparison base as deleted files, so this
  # entry ignores only that path. Remove it when no comparison base that CI
  # uses contains `protos/delino/tide/` (after the rename reaches main).
  ignore:
    - delino/tide
