version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Service names already end in Service; RPC request and response names
    # are shared between transports (for example ExecRequest is used by the
    # relay RPC and inside DataFrame), so the per-RPC unique message rules do
    # not apply to this package.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
