syntax = "proto3";

package delino.ownsand.v1;

import "delino/ownsand/v1/common.proto";
import "delino/ownsand/v1/data_frame.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/mono/protos/delino/ownsand/v1;ownsandv1";

// GuestService runs inside each sandbox guest on the hypervisor socket. Only
// the device agent calls it. It never reaches the control plane.
service GuestService {
  // Report that the guest helper is ready to serve requests.
  rpc CheckReady(CheckReadyRequest) returns (CheckReadyResponse);
  // Set the guest clock from the host clock, after a memory-state restore
  // and after a resume.
  rpc SetClock(SetClockRequest) returns (SetClockResponse);
  // Serve DataFrame exec and file requests. The agent sends request frames
  // (EXEC_REQUEST, EXEC_ATTACH_REQUEST, FILE_READ_REQUEST, FILE_WRITE_CHUNK)
  // and the guest helper answers with EXEC_EVENT, FILE_READ_EVENT,
  // FILE_WRITE_RESULT, REQUEST_ACCEPTED and ERROR frames of the same
  // stream_id.
  rpc Serve(stream ServeRequest) returns (stream ServeResponse);
}

message CheckReadyRequest {}

message CheckReadyResponse {
  GuestOs guest_os = 1;
  string helper_version = 2;
}

message SetClockRequest {
  google.protobuf.Timestamp now = 1;
}

message SetClockResponse {}

message ServeRequest {
  DataFrame frame = 1;
}

message ServeResponse {
  DataFrame frame = 1;
}
