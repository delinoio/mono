syntax = "proto3";

package delino.ownsand.v1;

import "delino/ownsand/v1/common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/mono/protos/delino/ownsand/v1;ownsandv1";

// ---------------------------------------------------------------------------
// Operation requests and events. Sandbox content: components never log
// command, env, output or file chunks.
// ---------------------------------------------------------------------------

message ExecRequest {
  string organization_id = 1;
  string sandbox_id = 2;
  // UUID v7 that the caller generates before the first request.
  string exec_id = 3;
  // Argument array; the first element is the program. Sandbox content.
  repeated string command = 4;
  // Sandbox content.
  map<string, string> env = 5;
  string working_directory = 6;
  google.protobuf.Duration timeout = 7;
  // 32 random bytes per operation; part of the request digest.
  bytes binding_salt = 8;
}

message AttachExecRequest {
  string organization_id = 1;
  string sandbox_id = 2;
  string exec_id = 3;
  int64 stdout_offset = 4;
  int64 stderr_offset = 5;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

message ExecEvent {
  message Accepted {}
  message Keepalive {}
  message Started {
    string exec_id = 1;
  }
  message OutputTruncated {
    int64 first_stdout_offset = 1;
    int64 first_stderr_offset = 2;
  }
  message Output {
    OutputStream stream = 1;
    // Byte offset of the first byte of data in its stream.
    int64 offset = 2;
    // At most 64 KiB. Sandbox content.
    bytes data = 3;
  }
  message Exited {
    oneof result {
      int64 exit_code = 1;
      int32 signal = 2;
    }
    bool timed_out = 3;
  }
  message Failed {
    // Why the command could not start.
    string reason = 1;
  }
  message SandboxEnded {
    SandboxEndReason reason = 1;
  }
  // The sandbox is paused and the exec has not ended. The stream ends after this event.
  message Paused {}

  oneof event {
    Accepted accepted = 1;
    Keepalive keepalive = 2;
    Started started = 3;
    OutputTruncated output_truncated = 4;
    Output output = 5;
    Exited exited = 6;
    Failed failed = 7;
    SandboxEnded sandbox_ended = 8;
    Paused paused = 9;
  }
}

message ReadFileRequest {
  string organization_id = 1;
  string sandbox_id = 2;
  string read_id = 3;
  // Absolute guest path. Sandbox content.
  string path = 4;
  bytes binding_salt = 5;
  int64 offset = 6;
}

message FileChunk {
  int64 offset = 1;
  // At most 1 MiB. Sandbox content.
  bytes data = 2;
}

message ReadFileResponse {
  message Accepted {}
  message Keepalive {}
  message Finished {
    int64 size_bytes = 1;
  }
  oneof message {
    Accepted accepted = 1;
    Keepalive keepalive = 2;
    FileChunk chunk = 3;
    Finished finished = 4;
  }
}

message WriteFileFinish {
  int64 size_bytes = 1;
  uint32 mode = 2;
}

message WriteFileRequest {
  string organization_id = 1;
  string sandbox_id = 2;
  string write_id = 3;
  // Set on the first call of a write_id. Sandbox content.
  string path = 4;
  // Set on the first call of a write_id.
  bytes binding_salt = 5;
  FileChunk chunk = 6;
  // Set on the last call.
  WriteFileFinish finish = 7;
}

message WriteFileResponse {
  // Highest contiguous written offset from zero.
  int64 written_bytes = 1;
  bool finished = 2;
}

// Input of the request digest: SHA-256 over the deterministic binary encoding.
message RelayRequestBinding {
  message EnvEntry {
    string key = 1;
    string value = 2;
  }
  bytes binding_salt = 1;
  string sandbox_id = 2;
  RelayOperationKind operation_kind = 3;
  string operation_id = 4;
  repeated string command = 5;
  // Sorted by key bytes.
  repeated EnvEntry env = 6;
  string working_directory = 7;
  google.protobuf.Duration timeout = 8;
  string path = 9;
}

// ---------------------------------------------------------------------------
// Data path framing shared by the peer-to-peer data channel, the relay
// connection and the guest channel.
// ---------------------------------------------------------------------------

enum DataFrameKind {
  DATA_FRAME_KIND_UNSPECIFIED = 0;
  DATA_FRAME_KIND_RELAY_STREAM_OPEN = 1;
  DATA_FRAME_KIND_RELAY_STREAM_CLOSE = 2;
  DATA_FRAME_KIND_RELAY_WINDOW_UPDATE = 3;
  DATA_FRAME_KIND_KEEPALIVE = 4;
  DATA_FRAME_KIND_SUPPORTED_KINDS = 5;
  DATA_FRAME_KIND_SESSION_END = 6;
  DATA_FRAME_KIND_REQUEST_ACCEPTED = 7;
  DATA_FRAME_KIND_EXEC_REQUEST = 8;
  DATA_FRAME_KIND_EXEC_ATTACH_REQUEST = 9;
  DATA_FRAME_KIND_EXEC_EVENT = 10;
  DATA_FRAME_KIND_FILE_READ_REQUEST = 11;
  DATA_FRAME_KIND_FILE_CHUNK = 12;
  DATA_FRAME_KIND_FILE_WRITE_CHUNK = 13;
  DATA_FRAME_KIND_FILE_WRITE_RESULT = 14;
  DATA_FRAME_KIND_ERROR = 15;
  DATA_FRAME_KIND_FILE_READ_FINISHED = 16;
}

message RelayStreamOpen {
  string grant_id = 1;
  // First credit window for the agent's frames toward the caller, in bytes.
  int64 initial_window = 2;
}

message RelayStreamClose {}

message RelayWindowUpdate {
  int64 added_bytes = 1;
}

message FrameKeepalive {
  bool echo_requested = 1;
}

message SupportedFrameKinds {
  repeated DataFrameKind kinds = 1;
}

message SessionEnd {
  SessionEndReason reason = 1;
}

message RequestAccepted {}

message FrameError {
  // Connect error code name, for example "permission_denied".
  string code = 1;
  string message = 2;
}

message DataFrame {
  uint64 stream_id = 1;
  string sandbox_id = 2;
  DataFrameKind kind = 3;
  oneof payload {
    RelayStreamOpen relay_stream_open = 10;
    RelayStreamClose relay_stream_close = 11;
    RelayWindowUpdate relay_window_update = 12;
    FrameKeepalive keepalive = 13;
    SupportedFrameKinds supported_kinds = 14;
    SessionEnd session_end = 15;
    RequestAccepted request_accepted = 16;
    ExecRequest exec_request = 17;
    AttachExecRequest exec_attach_request = 18;
    ExecEvent exec_event = 19;
    ReadFileRequest file_read_request = 20;
    FileChunk file_chunk = 21;
    WriteFileRequest file_write_chunk = 22;
    WriteFileResponse file_write_result = 23;
    FrameError error = 24;
    ReadFileResponse.Finished file_read_finished = 25;
  }
}

// ---------------------------------------------------------------------------
// Signaling and relay authorization.
// ---------------------------------------------------------------------------

message IceServer {
  repeated string urls = 1;
}

message GetIceServersRequest {
  string organization_id = 1;
}

message GetIceServersResponse {
  repeated IceServer ice_servers = 1;
}

message OpenSessionRequest {
  string organization_id = 1;
  string sandbox_id = 2;
  // Non-trickle SDP offer with all candidates. Never logged.
  string sdp_offer = 3;
}

message OpenSessionResponse {
  string session_id = 1;
  // Never logged.
  string sdp_answer = 2;
  google.protobuf.Timestamp expire_time = 3;
}

message AuthorizeRelayRequest {
  string organization_id = 1;
  string sandbox_id = 2;
  RelayOperationKind operation_kind = 3;
  string operation_id = 4;
  // Absent for ATTACH_EXEC.
  bytes request_digest = 5;
  // UUID v7 per logical request, reused for retries.
  string authorization_id = 6;
  optional string replaces_grant_id = 7;
}

message AuthorizeRelayResponse {
  string grant_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  google.protobuf.Duration expires_in = 3;
}

service DataPathService {
  rpc GetIceServers(GetIceServersRequest) returns (GetIceServersResponse);
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc AuthorizeRelay(AuthorizeRelayRequest) returns (AuthorizeRelayResponse);
}

// Requests carry the grant ID in the Ownsand-Relay-Grant-Id header.
service RelayService {
  rpc Exec(ExecRequest) returns (stream ExecEvent);
  rpc AttachExec(AttachExecRequest) returns (stream ExecEvent);
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
}

// Device-facing relay connection, authenticated with the osd_ credential.
service RelayAgentService {
  rpc Connect(stream DataFrame) returns (stream DataFrame);
}
