syntax = "proto3";

package delino.ownsand.v1;

import "delino/ownsand/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/mono/protos/delino/ownsand/v1;ownsandv1";

// Billing phase of an organization. The control plane computes it from the
// organization's link and the billing status that delino-accounts reports.
enum BillingPhase {
  BILLING_PHASE_UNSPECIFIED = 0;
  // No billing restriction.
  BILLING_PHASE_ALLOWED = 1;
  // Non-payment: the control plane rejects resource creation.
  BILLING_PHASE_BLOCKED = 2;
  // Non-payment for 3 days: running sandboxes are paused, and the data path
  // is rejected too.
  BILLING_PHASE_SUSPENDED = 3;
}

// A usage meter of OwnSand. The domain contracts own the prices and the
// measurement.
enum BillingMeter {
  BILLING_METER_UNSPECIFIED = 0;
  // Relay egress. Quantity unit: bytes.
  BILLING_METER_RELAY_EGRESS = 1;
  // Exported-snapshot R2 storage. Quantity unit: byte-seconds.
  BILLING_METER_R2_STORAGE = 2;
  // Class A RPC calls. Quantity unit: calls.
  BILLING_METER_CLASS_A_RPC = 3;
  // Class B RPC calls. Quantity unit: calls.
  BILLING_METER_CLASS_B_RPC = 4;
}

// Role of a user in a delino-accounts billing account.
enum BillingAccountRole {
  BILLING_ACCOUNT_ROLE_UNSPECIFIED = 0;
  BILLING_ACCOUNT_ROLE_OWNER = 1;
  BILLING_ACCOUNT_ROLE_ADMIN = 2;
  BILLING_ACCOUNT_ROLE_VIEWER = 3;
}

// BillingService shows the billing of an organization and links it to a
// delino-accounts billing account. Every RPC takes an organization_id and
// needs a membership in the organization (`not_found` otherwise). These RPCs
// are never billed and never rejected by billing enforcement, so that an
// organization can always recover. Payments, top-ups and billing account
// management stay on `https://accounts.delino.io`. An RPC that needs
// delino-accounts fails with `unavailable` while it cannot be reached.
service BillingService {
  // Read the billing phase of the organization. Every member and API key of
  // the organization may call it. It reads only the control plane's status
  // cache.
  rpc GetBillingStatus(GetBillingStatusRequest) returns (GetBillingStatusResponse);
  // Read the linked billing account, its balance and the usage and cost of
  // the organization in the current UTC calendar month. Owner and admin
  // only; API keys get `permission_denied`. An organization without a linked
  // billing account fails with `failed_precondition`.
  rpc GetBillingUsage(GetBillingUsageRequest) returns (GetBillingUsageResponse);
  // List the billing accounts in which the caller is owner or admin, for the
  // link flow. Organization owner only; API keys get `permission_denied`.
  rpc ListLinkableBillingAccounts(ListLinkableBillingAccountsRequest) returns (ListLinkableBillingAccountsResponse);
  // Link the organization to a billing account. The caller must be the
  // organization owner and an owner or admin of the billing account
  // (`permission_denied` otherwise); API keys get `permission_denied`. An
  // unknown billing account, or one in which the caller has no membership,
  // fails with `not_found`. An organization that is linked to another
  // billing account fails with `already_exists`; unlink it first. Linking to
  // the linked billing account again changes nothing.
  rpc LinkBillingAccount(LinkBillingAccountRequest) returns (LinkBillingAccountResponse);
  // Remove the link of the organization. Organization owner only; API keys
  // get `permission_denied`. The organization becomes blocked with
  // ACCOUNT_REQUIRED at once. Idempotent: an organization without a link
  // succeeds and changes nothing. Usage of earlier windows stays on the
  // former billing account.
  rpc UnlinkBillingAccount(UnlinkBillingAccountRequest) returns (UnlinkBillingAccountResponse);
}

// Billing phase of an organization, readable by every member.
message OrganizationBilling {
  // The phase that billing enforcement applies now. When the cached status
  // of a linked organization is older than 1 hour, the control plane fails
  // open and reports ALLOWED.
  BillingPhase phase = 1;
  // Reason that a rejected RPC carries in ErrorDetail.billing_reason:
  // UNSPECIFIED for ALLOWED, ACCOUNT_REQUIRED for a BLOCKED organization
  // without a link, BLOCKED for a BLOCKED organization with a link and
  // SUSPENDED for SUSPENDED.
  BillingReason reason = 2;
  // True when the organization is linked to a billing account.
  bool linked = 3;
  // Start of the non-payment. Set for BLOCKED and SUSPENDED. For an
  // organization without a link, the time when the link went missing: its
  // creation, its unlink or ownership transfer, or the billing launch for an
  // organization that existed before. When the organization was already in
  // non-payment at that time, the earlier start is kept, so unlinking or
  // relinking never restarts the 3-day period.
  google.protobuf.Timestamp blocked_since = 4;
  // blocked_since plus 3 days: when a BLOCKED organization becomes
  // SUSPENDED, or became SUSPENDED. Set for BLOCKED and SUSPENDED.
  google.protobuf.Timestamp suspend_time = 5;
}

// Usage and cost of one meter in a period.
message BillingMeterUsage {
  BillingMeter meter = 1;
  // Sum of the measured quantities, in the unit of the meter.
  int64 quantity = 2;
  // Sum of the window amounts. Each 5-minute window amount is rounded up to
  // a whole micro-USD once.
  int64 amount_usd_micros = 3;
}

// A billing account that the caller can link.
message LinkableBillingAccount {
  string billing_account_id = 1;
  string name = 2;
  // OWNER or ADMIN.
  BillingAccountRole role = 3;
}

message GetBillingStatusRequest {
  string organization_id = 1;
}

message GetBillingStatusResponse {
  OrganizationBilling billing = 1;
  // Set only for the organization owner when an account is linked.
  optional string billing_account_id = 2;
}

message GetBillingUsageRequest {
  string organization_id = 1;
}

message GetBillingUsageResponse {
  string billing_account_id = 1;
  string billing_account_name = 2;
  // Balance of the billing account. Negative when it has debt.
  int64 balance_usd_micros = 3;
  // Start of the current UTC calendar month.
  google.protobuf.Timestamp month_start = 4;
  // Usage of the organization in windows that start in the current UTC
  // calendar month, one entry for every meter in BillingMeter order, zero
  // when the meter had no usage. Usage that the control plane has not
  // reported yet is not included.
  repeated BillingMeterUsage meter_usages = 5;
}

message ListLinkableBillingAccountsRequest {
  string organization_id = 1;
  // Default 50, maximum 200.
  int32 page_size = 2;
  string page_token = 3;
}

message ListLinkableBillingAccountsResponse {
  repeated LinkableBillingAccount billing_accounts = 1;
  string next_page_token = 2;
}

message LinkBillingAccountRequest {
  string organization_id = 1;
  // UUID of a delino-accounts billing account.
  string billing_account_id = 2;
}

message LinkBillingAccountResponse {
  // Billing phase after the link.
  OrganizationBilling billing = 1;
  string billing_account_name = 2;
}

message UnlinkBillingAccountRequest {
  string organization_id = 1;
  // When set, unlink only if this is the current billing account.
  optional string expected_billing_account_id = 2;
}

message UnlinkBillingAccountResponse {
  // Billing phase after the unlink.
  OrganizationBilling billing = 1;
}
