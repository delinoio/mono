syntax = "proto3";

package delino.sandrun.v1;

import "delino/sandrun/v1/common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/mono/protos/delino/sandrun/v1;sandrunv1";

// DevSessionService gives one user a sandbox of a chosen guest OS for builds
// and tests. Its RPCs accept a Logto access token or a personal API key.
service DevSessionService {
  // List the DEV_SESSION runner profiles.
  rpc ListDevSessionProfiles(ListDevSessionProfilesRequest) returns (ListDevSessionProfilesResponse);
  // Create a dev session request for a profile. Returns at once with the dev
  // session and its state.
  rpc CreateDevSession(CreateDevSessionRequest) returns (CreateDevSessionResponse);
  // Read one dev session.
  rpc GetDevSession(GetDevSessionRequest) returns (GetDevSessionResponse);
  // List dev sessions of the organization.
  rpc ListDevSessions(ListDevSessionsRequest) returns (ListDevSessionsResponse);
  // Cancel a queued dev session or delete a starting or running one.
  rpc DeleteDevSession(DeleteDevSessionRequest) returns (DeleteDevSessionResponse);
  // Run a command in a running dev session and stream its events. The
  // stream ends before 14 minutes with an OK status and no final event; the
  // client continues with AttachDevSessionExec.
  rpc ExecDevSession(ExecDevSessionRequest) returns (stream ExecDevSessionResponse);
  // Continue the event stream of an exec from given stdout and stderr
  // offsets.
  rpc AttachDevSessionExec(AttachDevSessionExecRequest) returns (stream AttachDevSessionExecResponse);
  // Stream a guest file from an offset in chunks of at most 1 MiB.
  rpc ReadDevSessionFile(ReadDevSessionFileRequest) returns (stream ReadDevSessionFileResponse);
  // Write one chunk of at most 1 MiB to a guest file at an offset.
  rpc WriteDevSessionFile(WriteDevSessionFileRequest) returns (WriteDevSessionFileResponse);
}

// A DEV_SESSION runner profile, as dev session users see it.
message DevSessionProfile {
  string runner_profile_id = 1;
  string name = 2;
  GuestOs guest_os = 3;
  Resources resources = 4;
  string workspace_path = 5;
  google.protobuf.Duration idle_ttl = 6;
  google.protobuf.Duration max_ttl = 7;
  google.protobuf.Duration max_queue_wait = 8;
}

message DevSession {
  // The ID of the request of the dev session.
  string dev_session_id = 1;
  string organization_id = 2;
  string runner_profile_id = 3;
  string owner_user_id = 4;
  // At most 100 characters, for display.
  string label = 5;
  GuestOs guest_os = 6;
  string workspace_path = 7;
  RequestState state = 8;
  RequestEndReason end_reason = 9;
  google.protobuf.Timestamp queued_at = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp ended_at = 12;
  // Set when a runner serves the session.
  string runner_id = 13;
  string ownsand_device_id = 14;
  // Name of the runner profile, for display.
  string runner_profile_name = 15;
}

message ListDevSessionProfilesRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListDevSessionProfilesResponse {
  repeated DevSessionProfile profiles = 1;
  string next_page_token = 2;
}

message CreateDevSessionRequest {
  string organization_id = 1;
  string runner_profile_id = 2;
  // Optional, at most 100 characters.
  string label = 3;
}

message CreateDevSessionResponse {
  DevSession dev_session = 1;
}

message GetDevSessionRequest {
  string organization_id = 1;
  string dev_session_id = 2;
}

message GetDevSessionResponse {
  DevSession dev_session = 1;
}

message ListDevSessionsRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  // Optional owner filter.
  oneof owner {
    string owner_user_id = 4;
    // Only the caller's own dev sessions.
    bool owned_by_caller = 5;
  }
  string runner_profile_id = 6;
  repeated RequestState states = 7;
  // Include terminal dev sessions. Default: only QUEUED, STARTING and
  // RUNNING.
  bool include_ended = 8;
}

message ListDevSessionsResponse {
  repeated DevSession dev_sessions = 1;
  string next_page_token = 2;
}

message DeleteDevSessionRequest {
  string organization_id = 1;
  string dev_session_id = 2;
}

message DeleteDevSessionResponse {
  DevSession dev_session = 1;
}

message ExecDevSessionRequest {
  string organization_id = 1;
  string dev_session_id = 2;
  // UUID v7 that the client generates.
  string exec_id = 3;
  // Argument array; the first element is the program. Never logged.
  repeated string command = 4;
  // Never stored, logged or audited.
  map<string, string> env = 5;
  // An absolute guest path, or a path relative to the workspace path.
  // Default: the workspace path.
  string working_directory = 6;
  // Absent means no timeout.
  google.protobuf.Duration timeout = 7;
}

message ExecDevSessionResponse {
  DevSessionExecEvent event = 1;
}

message AttachDevSessionExecRequest {
  string organization_id = 1;
  string dev_session_id = 2;
  string exec_id = 3;
  // Next stdout byte offset that the client needs.
  int64 stdout_offset = 4;
  // Next stderr byte offset that the client needs.
  int64 stderr_offset = 5;
}

message AttachDevSessionExecResponse {
  DevSessionExecEvent event = 1;
}

message DevSessionExecKeepalive {}

message DevSessionExecStarted {
  string exec_id = 1;
  google.protobuf.Timestamp start_time = 2;
}

// The requested offsets are older than the kept output.
message DevSessionExecOutputTruncated {
  // First available stdout offset.
  int64 stdout_offset = 1;
  // First available stderr offset.
  int64 stderr_offset = 2;
}

// One output chunk. Never logged.
message DevSessionExecOutput {
  // Byte offset of data in its stream.
  int64 offset = 1;
  bytes data = 2;
}

message DevSessionExecExited {
  oneof status {
    int64 exit_code = 1;
    int32 signal = 2;
  }
  // True when the exec timeout stopped the command.
  bool timed_out = 3;
  google.protobuf.Timestamp end_time = 4;
}

// The command could not start.
message DevSessionExecFailed {
  ExecFailureReason reason = 1;
  string message = 2;
}

// The sandbox ended before the exec result could be delivered.
message DevSessionExecSandboxEnded {
  // The OwnSand end reason as text.
  string reason = 1;
}

// One event of a dev session exec. It copies the meaning of the OwnSand exec
// events.
message DevSessionExecEvent {
  oneof event {
    DevSessionExecKeepalive keepalive = 1;
    DevSessionExecStarted started = 2;
    DevSessionExecOutputTruncated output_truncated = 3;
    DevSessionExecOutput stdout = 4;
    DevSessionExecOutput stderr = 5;
    DevSessionExecExited exited = 6;
    DevSessionExecFailed failed = 7;
    DevSessionExecSandboxEnded sandbox_ended = 8;
  }
}

message ReadDevSessionFileRequest {
  string organization_id = 1;
  string dev_session_id = 2;
  // UUID v7 that the client generates.
  string read_id = 3;
  // An absolute guest path, or a path relative to the workspace path.
  string path = 4;
  int64 offset = 5;
}

message DevSessionFileChunk {
  int64 offset = 1;
  // At most 1 MiB. Never logged.
  bytes data = 2;
}

message DevSessionFileEnd {
  // Size of the whole file.
  int64 size_bytes = 1;
}

message ReadDevSessionFileResponse {
  oneof event {
    DevSessionFileChunk chunk = 1;
    // The final message.
    DevSessionFileEnd end = 2;
  }
}

message WriteDevSessionFileRequest {
  string organization_id = 1;
  string dev_session_id = 2;
  // UUID v7 that the client generates for the whole file, before the first
  // chunk. Every chunk of the file uses the same write_id.
  string write_id = 3;
  // An absolute guest path, or a path relative to the workspace path. The
  // file appears at the path only after the final chunk.
  string path = 4;
  int64 offset = 5;
  // At most 1 MiB. Never logged.
  bytes data = 6;
  // Unix permission bits of the file, read with the final chunk; 0 means
  // 0644. Windows guests ignore it.
  uint32 mode = 7;
  // True for the last chunk. The written chunks must then cover exactly
  // [0, offset + len(data)).
  bool final = 8;
}

message WriteDevSessionFileResponse {
  string write_id = 1;
  // Offset and length of the chunk that this call wrote.
  int64 offset = 2;
  int64 length = 3;
  // True when the call finished the write and moved the file into place.
  bool finished = 4;
  // Size of the file, when finished is true.
  int64 size_bytes = 5;
}
