syntax = "proto3";

package delino.tide.v1;

import "delino/tide/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/mono/protos/delino/tide/v1;tidev1";

// GitHubService links installations of the tide GitHub App to a tide
// organization.
service GitHubService {
  // Return the app installation URL with a single-use `state`.
  rpc CreateGitHubInstallUrl(CreateGitHubInstallUrlRequest) returns (CreateGitHubInstallUrlResponse);
  // Link an installation with `github_installation_id`, `code` and `state`.
  rpc LinkGitHubInstallation(LinkGitHubInstallationRequest) returns (LinkGitHubInstallationResponse);
  // List linked installations with their account, state and runner group.
  rpc ListGitHubInstallations(ListGitHubInstallationsRequest) returns (ListGitHubInstallationsResponse);
  // List the runner groups of an installation's GitHub organization.
  rpc ListGitHubRunnerGroups(ListGitHubRunnerGroupsRequest) returns (ListGitHubRunnerGroupsResponse);
  // Set the runner group of an installation.
  rpc UpdateGitHubInstallation(UpdateGitHubInstallationRequest) returns (UpdateGitHubInstallationResponse);
  // Remove the link. Cancels its queued requests and deletes its waiting
  // runners.
  rpc UnlinkGitHubInstallation(UnlinkGitHubInstallationRequest) returns (UnlinkGitHubInstallationResponse);
}

// A linked installation of the tide GitHub App on a GitHub organization.
message GitHubInstallation {
  // tide identifier (UUID v7) of the link.
  string installation_id = 1;
  string organization_id = 2;
  // GitHub numeric installation ID.
  int64 github_installation_id = 3;
  // Login of the GitHub organization.
  string github_account_login = 4;
  int64 github_account_id = 5;
  GitHubInstallationState state = 6;
  // Runner group of the tide runners in the GitHub organization.
  int64 github_runner_group_id = 7;
  string runner_group_name = 8;
  google.protobuf.Timestamp create_time = 9;
}

// A runner group of a GitHub organization.
message GitHubRunnerGroup {
  int64 github_runner_group_id = 1;
  string name = 2;
  // `all`, `selected` or `private`, as GitHub reports it.
  string visibility = 3;
  bool is_default = 4;
}

message CreateGitHubInstallUrlRequest {
  string organization_id = 1;
}

message CreateGitHubInstallUrlResponse {
  // Installation URL of the app with the `state` query parameter.
  string url = 1;
  // 10 minutes after creation. The state is single-use.
  google.protobuf.Timestamp expire_time = 2;
}

message LinkGitHubInstallationRequest {
  string organization_id = 1;
  int64 github_installation_id = 2;
  // OAuth code of the GitHub callback. Secret: never log.
  string code = 3;
  // `state` of the GitHub callback. Secret: never log.
  string state = 4;
}

message LinkGitHubInstallationResponse {
  GitHubInstallation installation = 1;
}

message ListGitHubInstallationsRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListGitHubInstallationsResponse {
  repeated GitHubInstallation installations = 1;
  string next_page_token = 2;
}

message ListGitHubRunnerGroupsRequest {
  string organization_id = 1;
  string installation_id = 2;
}

message ListGitHubRunnerGroupsResponse {
  repeated GitHubRunnerGroup runner_groups = 1;
}

message UpdateGitHubInstallationRequest {
  string organization_id = 1;
  string installation_id = 2;
  int64 github_runner_group_id = 3;
}

message UpdateGitHubInstallationResponse {
  GitHubInstallation installation = 1;
}

message UnlinkGitHubInstallationRequest {
  string organization_id = 1;
  string installation_id = 2;
}

message UnlinkGitHubInstallationResponse {}
