syntax = "proto3";

package delino.tide.v1;

import "delino/tide/v1/common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/mono/protos/delino/tide/v1;tidev1";

// RunnerProfileService manages the admin-defined descriptions of runners.
service RunnerProfileService {
  // Create a runner profile.
  rpc CreateRunnerProfile(CreateRunnerProfileRequest) returns (CreateRunnerProfileResponse);
  // Read one runner profile.
  rpc GetRunnerProfile(GetRunnerProfileRequest) returns (GetRunnerProfileResponse);
  // List runner profiles.
  rpc ListRunnerProfiles(ListRunnerProfilesRequest) returns (ListRunnerProfilesResponse);
  // Change the mutable fields of a runner profile.
  rpc UpdateRunnerProfile(UpdateRunnerProfileRequest) returns (UpdateRunnerProfileResponse);
  // Delete a runner profile. Ends its queued requests with CANCELED and
  // deletes its warm runners and its runners that wait for work.
  rpc DeleteRunnerProfile(DeleteRunnerProfileRequest) returns (DeleteRunnerProfileResponse);
}

// A runner profile. See the runner profile table of the control plane
// contract for the validation of each field.
message RunnerProfile {
  // Output only.
  string runner_profile_id = 1;
  // Output only.
  string organization_id = 2;
  // Lowercase kebab-case, 1 to 40 characters, unique in the organization.
  string name = 3;
  // Cannot change after creation.
  WorkloadKind workload_kind = 4;
  // Required for AGENT_SESSION, absent otherwise. Cannot change after
  // creation.
  string agent_integration_id = 5;
  // Required for DEV_SESSION, absent otherwise. An absolute guest path in the
  // syntax of guest_os.
  string workspace_path = 6;
  GuestOs guest_os = 7;
  // An OwnSand base image of guest_os, or an OwnSand template whose guest OS
  // is guest_os.
  oneof source {
    GuestOs base_image = 8;
    string ownsand_template_id = 9;
  }
  Resources resources = 10;
  NetworkMode network_mode = 11;
  google.protobuf.Duration idle_ttl = 12;
  // At most 7 days.
  google.protobuf.Duration max_ttl = 13;
  // UNSPECIFIED on create means the default of the workload kind: HIGH for
  // GITHUB_JOB, NORMAL otherwise.
  Priority priority = 14;
  // Greater than zero and at most 24 hours; at most 5 minutes for an
  // OPENAI_CODEX integration.
  google.protobuf.Duration max_queue_wait = 15;
  // 0 to 10.
  int32 warm_count = 16;
  // Output only. GITHUB_JOB only: the `runs-on` label `tide-<name>`.
  string github_label = 17;
  // Output only.
  google.protobuf.Timestamp create_time = 18;
  // Output only.
  google.protobuf.Timestamp update_time = 19;
}

message CreateRunnerProfileRequest {
  string organization_id = 1;
  // Output-only fields are ignored.
  RunnerProfile profile = 2;
}

message CreateRunnerProfileResponse {
  RunnerProfile profile = 1;
}

message GetRunnerProfileRequest {
  string organization_id = 1;
  string runner_profile_id = 2;
}

message GetRunnerProfileResponse {
  RunnerProfile profile = 1;
}

message ListRunnerProfilesRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  // Optional filter.
  WorkloadKind workload_kind = 4;
}

message ListRunnerProfilesResponse {
  repeated RunnerProfile profiles = 1;
  string next_page_token = 2;
}

message UpdateRunnerProfileRequest {
  string organization_id = 1;
  string runner_profile_id = 2;
  RunnerProfile profile = 3;
  // Paths of RunnerProfile to change. `workload_kind` and
  // `agent_integration_id` are rejected with `invalid_argument`. `source`
  // changes the source oneof.
  google.protobuf.FieldMask update_mask = 4;
}

message UpdateRunnerProfileResponse {
  RunnerProfile profile = 1;
}

message DeleteRunnerProfileRequest {
  string organization_id = 1;
  string runner_profile_id = 2;
}

message DeleteRunnerProfileResponse {}
