syntax = "proto3";

package delino.tide.v1;

option go_package = "github.com/delinoio/mono/protos/delino/tide/v1;tidev1";

// Common enums and messages of the tide API. The owning contract is
// docs/protos-tide-api-contract.md. The schemas do not import OwnSand
// schemas, so tide clients do not depend on OwnSand bindings.

// Role of a member in a tide organization.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_MEMBER = 3;
}

// State of an invitation.
enum InvitationState {
  INVITATION_STATE_UNSPECIFIED = 0;
  INVITATION_STATE_PENDING = 1;
  INVITATION_STATE_ACCEPTED = 2;
  INVITATION_STATE_REVOKED = 3;
  INVITATION_STATE_EXPIRED = 4;
}

// Kind of work that a runner profile serves.
enum WorkloadKind {
  WORKLOAD_KIND_UNSPECIFIED = 0;
  // One queued GitHub Actions job.
  WORKLOAD_KIND_GITHUB_JOB = 1;
  // One coding-agent session that a vendor asks to run.
  WORKLOAD_KIND_AGENT_SESSION = 2;
  // One dev session that a tide user asks for.
  WORKLOAD_KIND_DEV_SESSION = 3;
}

// Coding-agent vendor of an agent integration.
enum AgentVendor {
  AGENT_VENDOR_UNSPECIFIED = 0;
  AGENT_VENDOR_CLAUDE_CODE = 1;
  AGENT_VENDOR_CURSOR = 2;
  AGENT_VENDOR_OPENAI_CODEX = 3;
  AGENT_VENDOR_DEVIN = 4;
}

// Operating system of a runner guest.
enum GuestOs {
  GUEST_OS_UNSPECIFIED = 0;
  GUEST_OS_LINUX = 1;
  GUEST_OS_MACOS = 2;
  GUEST_OS_WINDOWS = 3;
}

// Queue priority of a runner profile.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_HIGH = 1;
  PRIORITY_NORMAL = 2;
  PRIORITY_LOW = 3;
}

// Network mode of a runner. Every runner program needs outbound access, so
// tide offers only OUTBOUND.
enum NetworkMode {
  NETWORK_MODE_UNSPECIFIED = 0;
  NETWORK_MODE_OUTBOUND = 1;
}

// State of a request. ENDED, CANCELED, EXPIRED and FAILED are terminal.
enum RequestState {
  REQUEST_STATE_UNSPECIFIED = 0;
  REQUEST_STATE_QUEUED = 1;
  // A runner was assigned to an agent session or dev session request and is
  // not yet BUSY. GITHUB_JOB requests go from QUEUED to RUNNING directly.
  REQUEST_STATE_STARTING = 2;
  REQUEST_STATE_RUNNING = 3;
  REQUEST_STATE_ENDED = 4;
  REQUEST_STATE_CANCELED = 5;
  REQUEST_STATE_EXPIRED = 6;
  REQUEST_STATE_FAILED = 7;
}

// Why a request ended.
enum RequestEndReason {
  REQUEST_END_REASON_UNSPECIFIED = 0;
  REQUEST_END_REASON_COMPLETED = 1;
  REQUEST_END_REASON_CANCELED_BY_SOURCE = 2;
  REQUEST_END_REASON_CANCELED_BY_USER = 3;
  REQUEST_END_REASON_MAX_QUEUE_WAIT = 4;
  REQUEST_END_REASON_NO_ELIGIBLE_DEVICE = 5;
  REQUEST_END_REASON_RUNNER_START_FAILED = 6;
  REQUEST_END_REASON_RUNNER_LOST = 7;
  REQUEST_END_REASON_PROFILE_DELETED = 8;
  REQUEST_END_REASON_INTEGRATION_REMOVED = 9;
  REQUEST_END_REASON_SESSION_DELETED = 10;
  REQUEST_END_REASON_SESSION_TTL_EXPIRED = 11;
  REQUEST_END_REASON_MEMBER_REMOVED = 12;
}

// State of a runner. DELETED and FAILED are terminal.
enum RunnerState {
  RUNNER_STATE_UNSPECIFIED = 0;
  RUNNER_STATE_CREATING = 1;
  RUNNER_STATE_PREPARING = 2;
  RUNNER_STATE_WARM = 3;
  RUNNER_STATE_WAITING_FOR_WORK = 4;
  RUNNER_STATE_BUSY = 5;
  RUNNER_STATE_DELETING = 6;
  RUNNER_STATE_DELETED = 7;
  RUNNER_STATE_FAILED = 8;
}

// Why a runner ended.
enum RunnerEndReason {
  RUNNER_END_REASON_UNSPECIFIED = 0;
  RUNNER_END_REASON_WORK_DONE = 1;
  RUNNER_END_REASON_SURPLUS = 2;
  RUNNER_END_REASON_WARM_RECLAIMED = 3;
  RUNNER_END_REASON_DELETED_BY_USER = 4;
  RUNNER_END_REASON_START_FAILED = 5;
  RUNNER_END_REASON_SANDBOX_ENDED = 6;
  RUNNER_END_REASON_CLEAN_UP = 7;
}

// State of the OwnSand link of an organization.
enum OwnSandLinkState {
  OWN_SAND_LINK_STATE_UNSPECIFIED = 0;
  OWN_SAND_LINK_STATE_ACTIVE = 1;
  // OwnSand rejected the stored API key. Dispatch has stopped.
  OWN_SAND_LINK_STATE_INVALID = 2;
}

// State of a linked GitHub installation.
enum GitHubInstallationState {
  GIT_HUB_INSTALLATION_STATE_UNSPECIFIED = 0;
  GIT_HUB_INSTALLATION_STATE_ACTIVE = 1;
  GIT_HUB_INSTALLATION_STATE_SUSPENDED = 2;
  GIT_HUB_INSTALLATION_STATE_DELETED = 3;
}

// State of a personal API key.
enum ApiKeyState {
  API_KEY_STATE_UNSPECIFIED = 0;
  API_KEY_STATE_ACTIVE = 1;
  API_KEY_STATE_EXPIRED = 2;
  API_KEY_STATE_REVOKED = 3;
}

// Why a dev session command could not start. The values copy the OwnSand
// exec failure reasons.
enum ExecFailureReason {
  EXEC_FAILURE_REASON_UNSPECIFIED = 0;
  // The program in command[0] does not exist.
  EXEC_FAILURE_REASON_PROGRAM_NOT_FOUND = 1;
  // The program exists but the guest cannot run it.
  EXEC_FAILURE_REASON_PERMISSION_DENIED = 2;
  // The working directory does not exist or is not a directory.
  EXEC_FAILURE_REASON_WORKING_DIRECTORY_INVALID = 3;
  // The guest has no resources to start the process.
  EXEC_FAILURE_REASON_RESOURCE_EXHAUSTED = 4;
  // Any other start failure; the message has the detail.
  EXEC_FAILURE_REASON_OTHER = 5;
}

// Connection state of an OwnSand device, for the capacity view.
enum DeviceState {
  DEVICE_STATE_UNSPECIFIED = 0;
  DEVICE_STATE_ONLINE = 1;
  DEVICE_STATE_OFFLINE = 2;
}

// Resources of a runner. All values are greater than zero.
message Resources {
  int32 vcpu_count = 1;
  int64 memory_mib = 2;
  int64 disk_gib = 3;
}
