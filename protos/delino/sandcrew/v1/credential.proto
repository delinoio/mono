syntax = "proto3";

package delino.sandcrew.v1;

import "delino/sandcrew/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/delinoio/mono/protos/delino/sandcrew/v1;sandcrewv1";

// CredentialService stores vendor credentials and session secrets. The API
// is write-only: no response carries a value.
service CredentialService {
  // Create or replace the vendor credential of a scope and vendor.
  rpc SetVendorCredential(SetVendorCredentialRequest) returns (SetVendorCredentialResponse);
  // List the organization credentials and the caller's own credentials,
  // without values.
  rpc ListVendorCredentials(ListVendorCredentialsRequest) returns (ListVendorCredentialsResponse);
  // Delete one vendor credential.
  rpc DeleteVendorCredential(DeleteVendorCredentialRequest) returns (DeleteVendorCredentialResponse);
  // Create or replace one session secret of the caller by name.
  rpc SetSessionSecret(SetSessionSecretRequest) returns (SetSessionSecretResponse);
  // List the caller's own session secrets, without values.
  rpc ListSessionSecrets(ListSessionSecretsRequest) returns (ListSessionSecretsResponse);
  // Delete one of the caller's session secrets.
  rpc DeleteSessionSecret(DeleteSessionSecretRequest) returns (DeleteSessionSecretResponse);
}

message VendorCredential {
  string vendor_credential_id = 1;
  CredentialScope scope = 2;
  AgentVendor vendor = 3;
  VendorCredentialKind kind = 4;
  // Set for the USER scope.
  string owner_user_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp value_set_at = 7;
  CredentialUpdateSource updated_by = 8;
}

message SessionSecret {
  string session_secret_id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp value_set_at = 4;
}

message SetVendorCredentialRequest {
  string organization_id = 1;
  CredentialScope scope = 2;
  AgentVendor vendor = 3;
  VendorCredentialKind kind = 4;
  // For CODEX_AUTH_JSON, the complete file content.
  bytes value = 5;
}

message SetVendorCredentialResponse {
  VendorCredential credential = 1;
}

message ListVendorCredentialsRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListVendorCredentialsResponse {
  repeated VendorCredential credentials = 1;
  string next_page_token = 2;
}

message DeleteVendorCredentialRequest {
  string organization_id = 1;
  string vendor_credential_id = 2;
}

message DeleteVendorCredentialResponse {}

message SetSessionSecretRequest {
  string organization_id = 1;
  // Matches ^[A-Za-z_][A-Za-z0-9_]{0,127}$.
  string name = 2;
  // At most 32 KiB.
  string value = 3;
}

message SetSessionSecretResponse {
  SessionSecret secret = 1;
}

message ListSessionSecretsRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSessionSecretsResponse {
  repeated SessionSecret secrets = 1;
  string next_page_token = 2;
}

message DeleteSessionSecretRequest {
  string organization_id = 1;
  string session_secret_id = 2;
}

message DeleteSessionSecretResponse {}
