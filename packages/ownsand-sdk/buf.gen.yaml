# SPDX-License-Identifier: Apache-2.0
# TypeScript code generation for the OwnSand schemas. scripts/protos.sh runs
# this template from protos/ with `--output packages/ownsand-sdk` (or a
# temporary directory for the drift check) and puts this package's
# node_modules/.bin first on PATH, so `protoc-gen-es` is the exact version
# pinned in package.json. Keep it equal to the @bufbuild/protobuf runtime
# version.
version: v2
clean: false
plugins:
  - local: protoc-gen-es
    out: src/gen
    include_imports: false
    opt:
      - target=ts
      - import_extension=ts
